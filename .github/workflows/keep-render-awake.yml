# Keep Render free web service awake by pinging /up on a schedule.
# Render free tier sleeps after ~15 minutes of no traffic.

name: Keep Render Awake

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: # allow manual run from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render API
        env:
          RENDER_HEALTH_URL: https://movies-flix-kh.onrender.com/up
        run: |
          set -e
          echo "Pinging $RENDER_HEALTH_URL"
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$RENDER_HEALTH_URL" -o /tmp/render-health.txt; then
              echo "OK (attempt $i)"
              head -c 200 /tmp/render-health.txt || true
              echo
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 15
          done
          echo "All ping attempts failed"
          exit 1
